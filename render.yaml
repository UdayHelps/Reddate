# Render Blueprint for Reddate.
# Deploy: push to GitHub, then in Render click "New +" → "Blueprint" and pick
# this repo. Render reads this file and provisions the service automatically.
#
# The app is a single long-lived Node process (Socket.IO needs a persistent
# connection + in-memory room state), so it runs as a "web" service, NOT a
# static site or serverless function. Render terminates TLS for us, which also
# satisfies the HTTPS requirement for getUserMedia (video/audio calls).
services:
  - type: web
    name: reddate
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      # Render injects PORT automatically; server.js already reads process.env.PORT.
      - key: NODE_VERSION
        value: 20.11.1
      # Optional TURN relay for calls behind strict NATs. Leave unset to use
      # STUN only (works on most networks). Set these in the Render dashboard.
      - key: TURN_URL
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false
      # GIF picker: a free key from developers.giphy.com. Set it in the Render
      # dashboard; without it the picker explains how to enable GIFs.
      - key: GIPHY_API_KEY
        sync: false
      # Accounts (optional): mail provider + public address. Also needs the Upstash settings.
      - key: VAULT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: PUBLIC_URL
        sync: false
      # Our own catalog from TMDB (free API Read Access Token from themoviedb.org)
      - key: TMDB_TOKEN
        sync: false
      # Optional "Buy me a coffee" link, e.g. https://buymeacoffee.com/yourname
      - key: SUPPORT_URL
        sync: false
      # Private stats page (/stats): Upstash Redis REST credentials + a password.
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: STATS_PASSWORD
        sync: false
